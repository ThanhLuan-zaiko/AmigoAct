[project]
name = "backend"
version = "0.1.0"
description = "AmigoAct API — FastAPI service for the AmigoAct platform"
readme = "README.md"
authors = [{ name = "ThanhLuan-zaiko", email = "deptrai05.pr@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121",
    "oracledb>=26.0.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    # NOTE: starlette >=1.7 deprecates `httpx` for its TestClient in favour of
    # `httpx2`. We follow the deprecation and filter any residual warning.
    "httpx2>=0.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "D",   # pydocstyle
    "RUF", # ruff-specific
]
ignore = [
    "D203", # incompatible with D211
    "D213", # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests may use private helpers and magic values, and D103 relaxes the
# "missing docstring in public function" rule for test functions.
"tests/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",  # magic methods on test doubles need no docstring
    "D107",  # __init__ on test doubles needs no docstring
    "S101",
    "S105",  # hardcoded credentials are normal inside the test suite
    "S106",
    "B011",
    "ANN401",
]
# `__init__.py` files are self-documenting by their module docstring only.
"src/backend/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ---------------------------------------------------------------------------
# mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# Pytest — unit / integration / regression
#
# The three layers are marked so each can be run (and gated in CI) alone:
#   uv run pytest -m unit
#   uv run pytest -m integration
#   uv run pytest -m regression
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=backend",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
    "--cov-report=xml",
    "--cov-report=lcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: pure in-process tests of a single unit, no I/O, no network",
    "integration: exercises multiple components together (HTTP, DB, FS)",
    "regression: locks in existing behaviour so future changes cannot break it",
    "slow: takes noticeably longer than a unit test",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Coverage HTML output lives in docs/ consumers expect; keep it out of git.
# ---------------------------------------------------------------------------
[tool.coverage.html]
directory = "htmlcov"
