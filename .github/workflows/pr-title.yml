name: PR checks

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Enforces the Conventional Commits rule stated in AGENTS.md, so the changelog
  # and the release notes stay derivable from history.
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must start with a lowercase letter and describe the
            change in the imperative mood ("add login", not "Added login").
          footerPattern: ^(BREAKING CHANGE|Refs?|Fixes|Closes|Issues)[\s\S]*$
